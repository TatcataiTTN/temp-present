<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Bradley Hand','Segoe Print','Comic Sans MS','Marker Felt',cursive">
  <title>Sketch of HụiKeeper 2.0 with SCAMPER call-outs</title>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
  </defs>
  <rect width="960" height="640" fill="#fffdf6"/>
  <g filter="url(#rough)" stroke="#1f2a26" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- phone -->
    <rect x="60" y="24" width="260" height="592" rx="34" fill="#ffffff"/>
    <rect x="75" y="44" width="230" height="530" rx="14"/>
    <!-- R: role toggle -->
    <rect x="95" y="52" width="190" height="34" rx="17"/>
    <rect x="97" y="54" width="92" height="30" rx="15" fill="#c8f0ea"/>
    <!-- E: offline chip -->
    <rect x="196" y="98" width="100" height="26" rx="13" fill="#fde8e8"/>
    <!-- ring -->
    <circle cx="140" cy="185" r="42"/>
    <path d="M140 143 A42 42 0 1 1 103 206" stroke="#0f766e" stroke-width="7"/>
    <!-- M: text size slider -->
    <path d="M205 182 H288"/><circle cx="252" cy="182" r="8" fill="#d97706"/>
    <!-- cards -->
    <rect x="90" y="240" width="205" height="56" rx="10"/>
    <rect x="236" y="252" width="52" height="30" rx="8" fill="#c8f0ea"/>
    <rect x="90" y="310" width="205" height="56" rx="10"/>
    <path d="M90 322 V354" stroke="#dc2626" stroke-width="8"/>
    <rect x="90" y="380" width="205" height="56" rx="10"/>
    <!-- bell + QR -->
    <path d="M236 402 q10 -14 20 0 v10 h-20 z"/><rect x="264" y="398" width="20" height="20"/>
    <path d="M268 402 h5 v5 h-5 z M277 411 h4 v4 h-4 z"/>
    <!-- tabs -->
    <path d="M75 520 H305"/>
    <path d="M152 520 V574 M228 520 V574"/>
    <path d="M238 562 h54" stroke="#db2777" stroke-width="5"/>
  </g>
  <g fill="#1f2a26" font-size="15">
    <text x="112" y="74">Player</text><text x="216" y="74">Host</text>
    <text x="202" y="116" font-size="13">offline ✓</text>
    <text x="92" y="118" font-size="20" font-weight="700">This week</text>
    <text x="118" y="190" font-size="18" font-weight="700">58%</text>
    <text x="212" y="170" font-size="13">A a  A</text>
    <text x="100" y="264" font-size="15">Lan  2,000,000</text><text x="100" y="284" font-size="12" fill="#5b6b64">due Fri</text>
    <text x="240" y="273" font-size="14" font-weight="700">PAID</text>
    <text x="104" y="334" font-size="15">Minh 1,000,000</text><text x="104" y="354" font-size="12" fill="#dc2626">3 days late</text>
    <text x="100" y="404" font-size="15">Hoa  500,000</text><text x="100" y="424" font-size="12" fill="#5b6b64">due Sun</text>
    <text x="98" y="546" font-size="14">Week</text>
    <text x="166" y="546" font-size="14">Circles</text>
    <text x="242" y="546" font-size="14" font-weight="700">Goals</text>
  </g>
  <g font-size="19">
  <path d="M285 70 C 335 70, 380 70, 418 70" fill="none" stroke="#0891b2" stroke-width="2.2" stroke-dasharray="6 5"/>
  <circle cx="285" cy="70" r="5" fill="#0891b2"/>
  <circle cx="440" cy="70" r="19" fill="#0891b2"/>
  <text x="440" y="77" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">R</text>
  <text x="474" y="77" font-size="19" fill="#1f2a26">Reverse: player view first, host one tap away</text>
  <path d="M295 113 C 345 113, 380 150, 418 150" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 5"/>
  <circle cx="295" cy="113" r="5" fill="#dc2626"/>
  <circle cx="440" cy="150" r="19" fill="#dc2626"/>
  <text x="440" y="157" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">E</text>
  <text x="474" y="157" font-size="19" fill="#1f2a26">Eliminate: no sign-up, still 100% offline</text>
  <path d="M295 182 C 345 182, 380 230, 418 230" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6 5"/>
  <circle cx="295" cy="182" r="5" fill="#d97706"/>
  <circle cx="440" cy="230" r="19" fill="#d97706"/>
  <text x="440" y="237" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">M</text>
  <text x="474" y="237" font-size="19" fill="#1f2a26">Modify: text size + cycle length adjustable</text>
  <path d="M288 272 C 338 272, 380 310, 418 310" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="6 5"/>
  <circle cx="288" cy="272" r="5" fill="#0f766e"/>
  <circle cx="440" cy="310" r="19" fill="#0f766e"/>
  <text x="440" y="317" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">S</text>
  <text x="474" y="317" font-size="19" fill="#1f2a26">Substitute: one-tap PAID replaces typing</text>
  <path d="M289 338 C 339 338, 380 390, 418 390" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 5"/>
  <circle cx="289" cy="338" r="5" fill="#7c3aed"/>
  <circle cx="440" cy="390" r="19" fill="#7c3aed"/>
  <text x="440" y="397" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">A</text>
  <text x="474" y="397" font-size="19" fill="#1f2a26">Adapt: loan-app style due / overdue timeline</text>
  <path d="M262 405 C 312 405, 380 470, 418 470" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="6 5"/>
  <circle cx="262" cy="405" r="5" fill="#2563eb"/>
  <circle cx="440" cy="470" r="19" fill="#2563eb"/>
  <text x="440" y="477" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">C</text>
  <text x="474" y="477" font-size="19" fill="#1f2a26">Combine: reminder bell + payment QR in the card</text>
  <path d="M262 566 C 312 566, 380 550, 418 550" fill="none" stroke="#db2777" stroke-width="2.2" stroke-dasharray="6 5"/>
  <circle cx="262" cy="566" r="5" fill="#db2777"/>
  <circle cx="440" cy="550" r="19" fill="#db2777"/>
  <text x="440" y="557" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">P</text>
  <text x="474" y="557" font-size="19" fill="#1f2a26">Put to another use: savings-goal tab</text></g>
  <text x="474" y="612" font-size="16" fill="#5b6b64">HụiKeeper 2.0 · SCAMPER Exercise 1 · sketch by hand-style SVG</text>
</svg>
